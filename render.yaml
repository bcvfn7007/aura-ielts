services:
  - type: web
    name: aura-ielts
    env: node
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: "cd client && npm install && npm run build && cd ../server && npm install"
    startCommand: "node server/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false   # You will paste your key manually in Render dashboard
      - key: PORT
        value: 10000
